[package]
name = "herdr-openai-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenAI-compatible API that drives agent CLIs running inside herdr panes"

[[bin]]
name = "herdr-openai-gateway"
path = "src/main.rs"

# Standalone workspace root; this crate must not join the herdr workspace.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "process",
] }
tokio-stream = "0.1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
